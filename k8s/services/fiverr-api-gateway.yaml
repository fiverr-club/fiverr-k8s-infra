apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiverr-api-gateway
  namespace: fiverr-club
  labels:
    app: fiverr-api-gateway
    tier: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fiverr-api-gateway
  template:
    metadata:
      labels:
        app: fiverr-api-gateway
        tier: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: fiverr-api-gateway
          image: ghcr.io/fiverr-club/fiverr-api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVER_PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: fiverr-common-config
            - secretRef:
                name: fiverr-common-secrets
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fiverr-api-gateway
  namespace: fiverr-club
  labels:
    app: fiverr-api-gateway
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: fiverr-api-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fiverr-api-gateway-hpa
  namespace: fiverr-club
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fiverr-api-gateway
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
