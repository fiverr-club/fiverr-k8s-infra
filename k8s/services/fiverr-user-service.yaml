apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiverr-user-service
  namespace: fiverr-club
  labels:
    app: fiverr-user-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fiverr-user-service
  template:
    metadata:
      labels:
        app: fiverr-user-service
        tier: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: fiverr-user-service
          image: ghcr.io/fiverr-club/fiverr-user-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://fiverr-postgres.fiverr-club.svc.cluster.local:5432/fiverr_user"
          envFrom:
            - configMapRef:
                name: fiverr-common-config
            - secretRef:
                name: fiverr-common-secrets
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 35
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fiverr-user-service
  namespace: fiverr-club
  labels:
    app: fiverr-user-service
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
      name: http
  selector:
    app: fiverr-user-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fiverr-user-service-hpa
  namespace: fiverr-club
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fiverr-user-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
