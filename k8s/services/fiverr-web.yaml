apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiverr-web
  namespace: fiverr-club
  labels:
    app: fiverr-web
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fiverr-web
  template:
    metadata:
      labels:
        app: fiverr-web
        tier: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: fiverr-web
          image: ghcr.io/fiverr-club/fiverr-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_API_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: fiverr-common-config
                  key: NEXT_PUBLIC_API_GATEWAY_URL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fiverr-web
  namespace: fiverr-club
  labels:
    app: fiverr-web
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: fiverr-web
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fiverr-web-hpa
  namespace: fiverr-club
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fiverr-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
