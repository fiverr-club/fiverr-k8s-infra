apiVersion: v1
kind: ConfigMap
metadata:
  name: fiverr-postgres-init-scripts
  namespace: fiverr-club
data:
  01-init-databases.sql: |
    CREATE DATABASE fiverr_auth;
    CREATE DATABASE fiverr_user;
    CREATE DATABASE fiverr_gig;
    CREATE DATABASE fiverr_order;
    CREATE DATABASE fiverr_payment;
    CREATE DATABASE fiverr_messaging;
    CREATE DATABASE fiverr_review;
    CREATE DATABASE fiverr_notification;
    GRANT ALL PRIVILEGES ON DATABASE fiverr_auth TO fiverr_admin;
    GRANT ALL PRIVILEGES ON DATABASE fiverr_user TO fiverr_admin;
    GRANT ALL PRIVILEGES ON DATABASE fiverr_gig TO fiverr_admin;
    GRANT ALL PRIVILEGES ON DATABASE fiverr_order TO fiverr_admin;
    GRANT ALL PRIVILEGES ON DATABASE fiverr_payment TO fiverr_admin;
    GRANT ALL PRIVILEGES ON DATABASE fiverr_messaging TO fiverr_admin;
    GRANT ALL PRIVILEGES ON DATABASE fiverr_review TO fiverr_admin;
    GRANT ALL PRIVILEGES ON DATABASE fiverr_notification TO fiverr_admin;
---
apiVersion: v1
kind: Service
metadata:
  name: fiverr-postgres
  namespace: fiverr-club
  labels:
    app: fiverr-postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  clusterIP: None
  selector:
    app: fiverr-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fiverr-postgres
  namespace: fiverr-club
  labels:
    app: fiverr-postgres
spec:
  serviceName: "fiverr-postgres"
  replicas: 1
  selector:
    matchLabels:
      app: fiverr-postgres
  template:
    metadata:
      labels:
        app: fiverr-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fiverr-common-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fiverr-common-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "fiverr_admin"]
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fiverr_admin"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init-scripts
          configMap:
            name: fiverr-postgres-init-scripts
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
