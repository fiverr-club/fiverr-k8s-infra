apiVersion: v1
kind: Service
metadata:
  name: fiverr-redis
  namespace: fiverr-club
  labels:
    app: fiverr-redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  clusterIP: None
  selector:
    app: fiverr-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fiverr-redis
  namespace: fiverr-club
  labels:
    app: fiverr-redis
spec:
  serviceName: "fiverr-redis"
  replicas: 1
  selector:
    matchLabels:
      app: fiverr-redis
  template:
    metadata:
      labels:
        app: fiverr-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
