apiVersion: v1
kind: Secret
metadata:
  name: fiverr-common-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "fiverr-ecosystem.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.stateful.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.stateful.postgres.password | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}
