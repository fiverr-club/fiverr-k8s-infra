services:
  fiverr-postgres:
    image: postgres:16-alpine
    container_name: fiverr-postgres
    environment:
      POSTGRES_USER: fiverr_admin
      POSTGRES_PASSWORD: FiverrClubStrongPgPassword2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/01-init-postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiverr_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  fiverr-redis:
    image: redis:7.4-alpine
    container_name: fiverr-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  fiverr-kafka:
    image: apache/kafka:3.8.0
    container_name: fiverr-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://fiverr-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  fiverr-api-gateway:
    build: ../fiverr-api-gateway
    image: ghcr.io/fiverr-club/fiverr-api-gateway:1.0.0
    container_name: fiverr-api-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: fiverr-redis
      AUTH_SERVICE_URI: http://fiverr-auth-service:8081
      USER_SERVICE_URI: http://fiverr-user-service:8082
      GIG_SERVICE_URI: http://fiverr-gig-service:8083
      ORDER_SERVICE_URI: http://fiverr-order-service:8084
      PAYMENT_SERVICE_URI: http://fiverr-payment-service:8085
      MESSAGING_SERVICE_URI: http://fiverr-messaging-service:8086
      REVIEW_SERVICE_URI: http://fiverr-review-service:8087
      NOTIFICATION_SERVICE_URI: http://fiverr-notification-service:8088
    depends_on:
      - fiverr-redis

  fiverr-auth-service:
    build: ../fiverr-auth-service
    image: ghcr.io/fiverr-club/fiverr-auth-service:1.0.0
    container_name: fiverr-auth-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://fiverr-postgres:5432/fiverr_auth
      SPRING_DATASOURCE_USERNAME: fiverr_admin
      SPRING_DATASOURCE_PASSWORD: FiverrClubStrongPgPassword2026!
      REDIS_HOST: fiverr-redis
      SPRING_DATA_REDIS_HOST: fiverr-redis
      KAFKA_BOOTSTRAP_SERVERS: fiverr-kafka:9092
    depends_on:
      - fiverr-postgres
      - fiverr-redis
      - fiverr-kafka

  fiverr-user-service:
    build: ../fiverr-user-service
    image: ghcr.io/fiverr-club/fiverr-user-service:1.0.0
    container_name: fiverr-user-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://fiverr-postgres:5432/fiverr_user
      SPRING_DATASOURCE_USERNAME: fiverr_admin
      SPRING_DATASOURCE_PASSWORD: FiverrClubStrongPgPassword2026!
      REDIS_HOST: fiverr-redis
      SPRING_DATA_REDIS_HOST: fiverr-redis
      KAFKA_BOOTSTRAP_SERVERS: fiverr-kafka:9092
    depends_on:
      - fiverr-postgres
      - fiverr-redis
      - fiverr-kafka

  fiverr-gig-service:
    build: ../fiverr-gig-service
    image: ghcr.io/fiverr-club/fiverr-gig-service:1.0.0
    container_name: fiverr-gig-service
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://fiverr-postgres:5432/fiverr_gig
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: fiverr_admin
      SPRING_DATASOURCE_PASSWORD: FiverrClubStrongPgPassword2026!
      REDIS_HOST: fiverr-redis
      KAFKA_BOOTSTRAP_SERVERS: fiverr-kafka:9092
    depends_on:
      - fiverr-postgres
      - fiverr-redis
      - fiverr-kafka

  fiverr-order-service:
    build: ../fiverr-order-service
    image: ghcr.io/fiverr-club/fiverr-order-service:1.0.0
    container_name: fiverr-order-service
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://fiverr-postgres:5432/fiverr_order
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: fiverr_admin
      SPRING_DATASOURCE_PASSWORD: FiverrClubStrongPgPassword2026!
      KAFKA_BOOTSTRAP_SERVERS: fiverr-kafka:9092
    depends_on:
      - fiverr-postgres
      - fiverr-kafka

  fiverr-payment-service:
    build: ../fiverr-payment-service
    image: ghcr.io/fiverr-club/fiverr-payment-service:1.0.0
    container_name: fiverr-payment-service
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://fiverr-postgres:5432/fiverr_payment
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: fiverr_admin
      SPRING_DATASOURCE_PASSWORD: FiverrClubStrongPgPassword2026!
      KAFKA_BOOTSTRAP_SERVERS: fiverr-kafka:9092
    depends_on:
      - fiverr-postgres
      - fiverr-kafka

  fiverr-messaging-service:
    build: ../fiverr-messaging-service
    image: ghcr.io/fiverr-club/fiverr-messaging-service:1.0.0
    container_name: fiverr-messaging-service
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://fiverr-postgres:5432/fiverr_messaging
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: fiverr_admin
      SPRING_DATASOURCE_PASSWORD: FiverrClubStrongPgPassword2026!
      REDIS_HOST: fiverr-redis
      KAFKA_BOOTSTRAP_SERVERS: fiverr-kafka:9092
    depends_on:
      - fiverr-postgres
