  fiverr-review-service:
    build: ../fiverr-review-service
    image: ghcr.io/fiverr-club/fiverr-review-service:1.0.0
    container_name: fiverr-review-service
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:postgresql://fiverr-postgres:5432/fiverr_review
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: fiverr_admin
      SPRING_DATASOURCE_PASSWORD: FiverrClubStrongPgPassword2026!
      KAFKA_BOOTSTRAP_SERVERS: fiverr-kafka:9092
