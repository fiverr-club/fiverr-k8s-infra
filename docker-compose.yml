      - fiverr-postgres
      - fiverr-kafka

  fiverr-notification-service:
    build: ../fiverr-notification-service
    image: ghcr.io/fiverr-club/fiverr-notification-service:1.0.0
    container_name: fiverr-notification-service
    ports:
      - "8088:8088"
    environment:
      SERVER_PORT: 8088
      SPRING_DATASOURCE_URL: jdbc:postgresql://fiverr-postgres:5432/fiverr_notification
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: fiverr_admin
      SPRING_DATASOURCE_PASSWORD: FiverrClubStrongPgPassword2026!
      KAFKA_BOOTSTRAP_SERVERS: fiverr-kafka:9092
    depends_on:
      - fiverr-postgres
      - fiverr-kafka

  fiverr-web:
    build: ../fiverr-web
    image: ghcr.io/fiverr-club/fiverr-web:1.0.0
    container_name: fiverr-web
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:8080/api/v1
    depends_on:
      - fiverr-api-gateway

volumes:
  postgres_data:
  redis_data:
